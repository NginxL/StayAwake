name: Build macOS App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check core behavior
        run: bash scripts/test.sh
      - name: Build universal app
        run: bash scripts/package.sh --universal
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: StayAwake-macOS-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
